name: Build

# Al publicar una Release, compila el ejecutable de Windows y adjunta a la
# Release el .zip portable y el instalador .exe. También se puede lanzar a mano
# (workflow_dispatch): compila el estado actual de la rama y sube los artefactos
# a la Release del tag indicado.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la Release a la que adjuntar los artefactos (p. ej. v0.1.3)"
        required: true

permissions:
  contents: write        # subir el artefacto a la Release

jobs:
  windows:
    name: Ejecutable de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # En una Release, el código exacto del tag. A mano, la rama desde la
          # que se lanza (el tag antiguo podría no tener aún el .spec).
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-build.txt

      - name: Compilar con PyInstaller
        run: pyinstaller GalacticGuardian.spec --noconfirm --clean

      - name: Verificar el ejecutable (--smoke)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\GalacticGuardian\GalacticGuardian.exe `
               -ArgumentList "--smoke" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke falló (exit $($p.ExitCode))" }

      - name: Construir el instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $tag = "${{ github.event.release.tag_name || inputs.tag }}"
          $version = $tag.TrimStart("v")
          iscc /DVersion=$version installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc falló (exit $LASTEXITCODE)" }

      - name: Comprimir y adjuntar a la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name || inputs.tag }}"
          $zip = "GalacticGuardian-$tag-windows.zip"
          $setup = "GalacticGuardian-$tag-setup.exe"
          Compress-Archive -Path dist\GalacticGuardian -DestinationPath $zip
          Move-Item GalacticGuardian-setup.exe $setup
          gh release upload $tag $zip $setup --clobber
